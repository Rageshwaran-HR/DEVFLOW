name: DevFlow CI

on:
  push:
    branches: [main, dev, qual]
  pull_request:
    branches: [main, dev, qual]

jobs:
  test-and-pack:
    name: Build, Test & Verify Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build CLI
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Verify Prettier Code Formatting
        run: npm run format:check

      - name: Verify ESLint Rules
        run: npm run lint

      - name: Perform NPM Pack Dry-Run
        run: npm pack --dry-run